name: CI

# main への push では Cloudflare Workers Builds が同じ typecheck / test を
# 実行してからデプロイするため、ここではマージ前のPRだけを検査する。
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
